# The `swift` agent preset: the fastest, cheapest coding-agent composition.
#
# It is `minimal` (a fixed-prompt, two-tool agent: persistent `bash` +
# `str_replace_editor`, complete one-line persona, no runtime context
# snapshots) plus one addition from `standard`: the compaction group. Without
# it a long session pays for its whole history on every request; with it,
# oversized tool results are pruned model-free first, and only pressure that
# survives pruning costs one summarization call (`compaction-basic` defaults
# to `auto`, so no command or listener wiring is needed here).
#
# Pruner thresholds are tighter than `standard`'s and the editor's output cap
# is halved: this surface produces fewer, smaller results, so old output is
# cut earlier.

# ── identity ────────────────────────────────────────────────────────────────

# The persona is the complete system prompt; `includeRuntimeContext: false`
# suppresses runtime context snapshots. The final sentence trades a few
# prefix tokens for concise replies and smaller reads.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a helpful software engineer assistant. Be concise: answer
      briefly, and read or output only what the task needs.
    complete: true
    includeRuntimeContext: false

# ── shell ───────────────────────────────────────────────────────────────────

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
# `bash` is also the search tool (`rg`/`grep`), which is why this preset
# ships no separate search tool.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# ── filesystem ──────────────────────────────────────────────────────────────

# The bare local filesystem shadows the host's sandboxed provider only for
# this preset. The editor shares that realm and requires absolute paths; its
# `view`/`create`/`str_replace`/`insert` commands are the whole read/write
# surface, so no separate fs tools are composed.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 8000

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. `tokenMeter` stays on the
# host plane; the rows here resolve that one instance, exactly as in
# `standard`. `command-compact` adds the manual `/compact` command, which is
# not model-facing and therefore costs no tokens.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 4096
        headChars: 2048
        tailChars: 512
